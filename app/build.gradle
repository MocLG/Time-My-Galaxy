import java.util.Properties

plugins {
    id 'com.android.application'
}

// Release signing. build.sh passes -PkeystoreProps=<path>; direct Gradle runs
// fall back to ~/.android/release-keystore.properties. The properties file
// holds storeFile=, alias=, and password= and stays outside the repository.
def keystorePropsPath = findProperty('keystoreProps')
def keystorePropsFile = keystorePropsPath != null
        ? new File(keystorePropsPath)
        : new File(System.getProperty('user.home'), '.android/release-keystore.properties')
def keystoreProps = new Properties()
def releaseSigningReady = keystorePropsFile.isFile()
if (releaseSigningReady) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def keystorePass = keystoreProps.getProperty('storePassword',
        keystoreProps.getProperty('password'))

// Short commit for the version line. A source archive without git still builds.
def gitCommit = "unknown"
try {
    gitCommit = providers.exec {
        workingDir rootDir
        commandLine "git", "rev-parse", "--short=12", "HEAD"
    }.standardOutput.asText.get().trim()
} catch (Throwable ignored) {
}

gradle.taskGraph.whenReady { graph ->
    if (graph.hasTask(':app:assembleRelease') && !releaseSigningReady) {
        throw new GradleException("release signing properties not found: "
                + keystorePropsFile + " (use build.sh release [path])")
    }
}

android {
    namespace 'dev.lukag.timemygalaxy'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.lukag.timemygalaxy'
        minSdk 31
        targetSdk 35
        versionCode 8
        versionName '1.6'

        buildConfigField "String", "GIT_COMMIT", "\"${gitCommit}\""
        buildConfigField "String", "REPO_URL",
                "\"https://github.com/MocLG/Time-My-Galaxy\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile new File(keystoreProps.getProperty('storeFile'))
                storePassword keystorePass
                keyAlias keystoreProps.getProperty('keyAlias',
                        keystoreProps.getProperty('alias'))
                keyPassword keystoreProps.getProperty('keyPassword', keystorePass)
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources.excludes += '/META-INF/{AL2.0,LGPL2.1}'
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.0'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
