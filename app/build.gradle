import java.util.Properties

plugins {
    id 'com.android.application'
}

// Release signing. build.sh passes -PkeystoreProps=<path>; direct Gradle runs
// fall back to ~/.android/release-keystore.properties. The properties file
// holds storeFile=, alias=, and password= and stays outside the repository.
def keystorePropsPath = findProperty('keystoreProps')
def keystorePropsFile = keystorePropsPath != null
        ? new File(keystorePropsPath)
        : new File(System.getProperty('user.home'), '.android/release-keystore.properties')
def keystoreProps = new Properties()
def releaseSigningReady = keystorePropsFile.isFile()
if (releaseSigningReady) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def keystorePass = keystoreProps.getProperty('storePassword',
        keystoreProps.getProperty('password'))

gradle.taskGraph.whenReady { graph ->
    if (graph.hasTask(':app:assembleRelease') && !releaseSigningReady) {
        throw new GradleException("release signing properties not found: "
                + keystorePropsFile + " (use build.sh release [path])")
    }
}

android {
    namespace 'dev.lukag.timemygalaxy'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.lukag.timemygalaxy'
        minSdk 31
        targetSdk 35
        versionCode 6
        versionName '1.4'
    }

    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile new File(keystoreProps.getProperty('storeFile'))
                storePassword keystorePass
                keyAlias keystoreProps.getProperty('keyAlias',
                        keystoreProps.getProperty('alias'))
                keyPassword keystoreProps.getProperty('keyPassword', keystorePass)
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources.excludes += '/META-INF/{AL2.0,LGPL2.1}'
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
